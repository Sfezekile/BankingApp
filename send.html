<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet"/>
  <style>
    body {
      background-image: linear-gradient(120deg,#95B1EE 0%, #364C84 100%);
      color: var(--white-color);
    }

    header {
      position: fixed;
      top: 5vh;
      left: 0;
      right: 0;
      background-color: transparent;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }
    .left i {
      font-size: 25px;
      color: var(--white-color);
    }
    .left a {
      text-decoration: none;
    }
    .mid h2 {
      font-size: 20px; font-weight: 400;
    }
    .right i{
      font-size: 25px;
      color: var(--white-color);
    }
    
    .amount-transfer {
      padding: 80px 24px 24px; /* Adjust padding to account for fixed header */
    }

    .amount-transfer {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 50vh;
      gap: 8px;
    }
    .amount-transfer .input {
      display: flex;
      width: 50%;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid var(--white-color);;
      gap: 8px;
    }
    .amount-transfer h2 {
        font-size: 25px; font-weight: 400;
    }
    .amount-transfer h1 {
        font-size: 25px; font-weight: 400;
        color: rgb(197, 201, 236);
    }
    .amount-transfer p {
        font-size: 13px; font-weight: 400;
        color: rgb(197, 201, 236);
    }

    .amount-transfer .amount-input {
      font-size: 32px;
      justify-content: center; align-items: center; text-align: left;
      border: none;
      outline: none;
      background: transparent;
      color: var(--white-color);
      width: 50%;
    }

    .action-transfer {
        display: flex;
        flex-direction: column;
        padding: 24px 24px 24px;
        border-radius: 24px;
        gap: 24px;
        background-color: var(--white-color);
    }
    .contact {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      border-radius: 20px;
      background-color: var(--accent-color-3);
    }
    .contact i { 
      color: var(--accent-color-1);
      font-size: 25px; font-weight: 500;
    }
    .user-img {
      width: 70px;
      height: 45px;
    }
    .user-img img {
      width: 100%;
      height: auto;
      border-radius: 50px;
      border: 2px solid var(--accent-color-1);
    }
    .send-to{
        font-size: 15px; font-weight: 400;
        color: var(--accent-color-1);
    }
    .name {
        font-size: 18px; font-weight: 500;
        color: var(--accent-color-1)
    }

    .number-container {
        width: 100%;
        display: grid;
        grid-template-rows: repeat(4, 1fr);
        grid-template-columns: repeat(3, 1fr);
        justify-items: center;
        align-items: center;
        gap: 8px;
    }
    .num-btn {
        position: relative;
        width: 110px;
        height: 60px;
        font-size: 20px; font-weight: 5000;
        border-radius: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: var(--accent-color-1);
        background-color: var(--white-gray);
    }
    .btn-send {
      width: 100%;
      font-size: 19px;
      padding: 10px;
      border: none;
      border-radius: 20px;
      color: var(--white-color);
      background-color: var(--accent-color-1);
    }
  </style>
</head>
<body>

    <header>
        <div class="left">
          <a href="index.html" class="back">
            <i class="ri-arrow-left-line"></i>
          </a>
        </div>

        <div class="mid">
            <h2>Transfer</h2>
        </div>

        <div class="right">
          <i class="ri-more-line"></i>
        </div>
    </header>

    <main>
      <section class="amount-transfer">
          <div class="input">
              <h1>R</h1>
              <h2>540.00</h2>
          </div>
          <p>Money in wallet available R 248,450.32</p>
      </section>
      <section class="action-transfer">
          
            <div class="contact">
                <div class="left">
                    <div class="user-img">
                        <img src="pofile.jpg" alt="">
                    </div>
                    <div class="details">
                        <p class="send-to">Send to</p>
                        <h2 class="name">Michael Susanto</h2>
                    </div>
                </div>
                <i class="ri-more-line"></i>
            </div>

          <div class="number-container">
              <div class="num-btn">
                <p>1</p>
              </div>
              <div class="num-btn">
                <p>2</p>
              </div>
              <div class="num-btn">
                <p>3</p>
              </div>
              <div class="num-btn">
                <p>4</p>
              </div>
              <div class="num-btn">
                <p>5</p>
              </div>
              <div class="num-btn">
                <p>6</p>
              </div>
              <div class="num-btn">
                <p>7</p>
              </div>
              <div class="num-btn">
                <p>8</p>
              </div>
              <div class="num-btn">
                <p>9</p>
              </div>
              <div class="num-btn">
                <p>.</p>
              </div>
              <div class="num-btn">
                <p>0</p>
              </div>
              <div class="num-btn">
                <i class="ri-arrow-left-s-line"></i>
              </div>
          </div>
          <div class="send">
              <button class="btn-send" type="submit">Send Money</button>
          </div>
      </section>
    </main>

</body>

</html>
